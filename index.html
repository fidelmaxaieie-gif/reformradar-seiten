<header>
  <h1>Wie viel davon ist Alterung?</h1>
  <p class="unterzeile">Eine Zahl hat sich verändert. Dieses Werkzeug rechnet aus,
  wie viel davon allein daran liegt, dass die Bevölkerung älter geworden ist —
  und wie viel daran, dass mehr oder weniger Menschen hier leben.</p>
</header>

<form id="auswahl" aria-label="Auswahl">
  <label>Zahl <select id="outcome"></select><span class="einzelwert"></span></label>
  <label id="sache-feld" hidden><span id="sache-name"></span> <select id="sache"></select><span class="einzelwert"></span></label>
  <label><span id="gebiet-name">Gebiet</span> <select id="gebiet"></select><span class="einzelwert"></span></label>
  <label>Zeitraum <select id="zeitraum"></select><span class="einzelwert"></span></label>
</form>

<p class="link-hinweis" id="link-hinweis" hidden></p>
<main id="ergebnis" aria-live="polite">
